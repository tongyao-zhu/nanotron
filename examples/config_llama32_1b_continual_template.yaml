checkpoints:
  checkpoint_interval: ${CHECKPOINT_INTERVAL}
  checkpoints_path: checkpoints-llama32-1b-${SUFFIX}
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: checkpoints-llama32-1b-${SUFFIX}
  save_initial_state: false
  save_final_state: true

data_stages:
- data:
    dataset:
      dataset_folder: /home/aiops/zhuty/cont_data/${DATASET_NAME}/llama_tokenized
    num_loading_workers: 2
    seed: 42
  name: ${DATASET_NAME}
  start_training_step: 1

general:
  project: nano-cont
  run: llama32-1b-${SUFFIX}
  seed: 42
  ignore_sanity_checks: true

logging:
  log_level: info
  log_level_replica: info
  iteration_step_info_interval: 1

model:
  dtype: bfloat16
  ddp_bucket_cap_mb: 25
  make_vocab_size_divisible_by: 1
  init_method:
    ${INIT_KEY}: ${INIT_VALUE}
  model_config:
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 8192
    is_qwen2_config: true
    max_position_embeddings: 131072
    num_attention_heads: 32
    num_hidden_layers: 16
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_scaling:
      factor: 32.0
      high_freq_factor: 4.0
      low_freq_factor: 1.0
      original_max_position_embeddings: 8192
      rope_type: llama3
    rope_theta: 500000.0
    rope_interleaved: false
    rope_seq_len_interpolation_factor: null
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
    _attn_implementation: flash_attention_2
    flex_attention_mask: null
    attention_bias: false
    sliding_window_size: null
    z_loss_enabled: false
    z_loss_coefficient: 0.0001
    no_rope_layer: null
    _fused_rotary_emb: true
    _fused_rms_norm: true
    _use_qkv_packed: ${USE_QKV_PACKED}
    _use_doc_masking: ${INTRADOC}
    log_attn_probs: false
    ring_attn_heads_k_stride: null
    moe_config: null
    diffusion_config:
      diffusion: ${IS_DIFFUSION}
      mask_token_id: ${MASK_TOKEN_ID}
      block_diffusion: ${IS_BLOCK_DIFFUSION}
      block_size: ${BLOCK_SIZE}
      shift: ${SHIFT}

optimizer:
  accumulate_grad_in_fp32: ${ACCUMULATE_GRAD_IN_FP32}
  clip_grad: 1.0
  weight_decay: 0.1
  optimizer_factory:
    name: adamW
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    torch_adam_is_fused: true
  learning_rate_scheduler:
    learning_rate: ${LEARNING_RATE}
    lr_warmup_steps: 100
    lr_warmup_style: linear
    lr_decay_style: linear
    lr_decay_steps: null
    lr_decay_starting_step: 25000  
    min_decay_lr: 5.0e-05
  zero_stage: ${ZERO_STAGE}

parallelism:
  dp: ${DP}
  tp: ${TP}
  pp: 1
  pp_engine: 1f1b
  expert_parallel_size: 1
  tp_mode: REDUCE_SCATTER
  tp_linear_async_communication: true
  tp_recompute_allgather: false
  context_parallel_size: 1
  recompute_layer: true

profiler: null

tokenizer:
  tokenizer_name_or_path: meta-llama/Llama-3.2-1B
  tokenizer_revision: null
  tokenizer_max_length: null

tokens:
  sequence_length: ${SEQUENCE_LENGTH}
  micro_batch_size: ${MICRO_BATCH_SIZE}
  batch_accumulation_per_replica: ${BATCH_ACCUM}
  train_steps: ${MAX_STEP}
  val_check_interval: -1
  limit_val_batches: 0
  limit_test_batches: 0

